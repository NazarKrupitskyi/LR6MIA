name: Deploy to Railway

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Змушуємо GitHub одразу зайти в папку LR 3, де лежать ваші файли
    defaults:
      run:
        working-directory: './LR 3'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Явно вказуємо файл LR 3.csproj, щоб dotnet НЕ читав файл LR 3.slnx (який шукає диск D:)
      - name: Restore dependencies
        run: dotnet restore "LR 3.csproj"

      - name: Build
        run: dotnet build "LR 3.csproj" --configuration Release --no-restore

      # Запуск тестів (вказуємо точний шлях до тестового проєкту)
      # Якщо цей крок знову впаде через шляхи, просто видаліть ці два рядки
      - name: Run tests
        run: dotnet test "EventControllerTEST/EventControllerTEST.csproj" --configuration Release --no-build --verbosity normal

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
